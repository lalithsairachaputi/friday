<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="main">

    <!-- Left Column: Hero -->
    <section class="hero">
      <video class="hero-video" autoplay muted loop playsinline>
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260506_081238_406ed0e3-5d83-436e-a512-0bbff7ec5b95.mp4" type="video/mp4">
      </video>

      <div class="hero-content">

        <div class="hero-item brand">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="white">
            <circle cx="10" cy="10" r="10"></circle>
          </svg>
          <span class="brand-name">Aurora</span>
        </div>

        <div class="hero-item heading-block">
          <h1 class="heading">Join Aurora</h1>
          <p class="subheading">Follow these 3 quick phases to activate your space.</p>
        </div>

        <div class="hero-item steps">
          <div class="step-item active">
            <span class="step-number">1</span>
            <span class="step-text">Register your identity</span>
          </div>
          <div class="step-item">
            <span class="step-number">2</span>
            <span class="step-text">Configure your studio</span>
          </div>
          <div class="step-item">
            <span class="step-number">3</span>
            <span class="step-text">Finalize your profile</span>
          </div>
        </div>

      </div>
    </section>

    <!-- Right Column: Form -->
    <section class="form-section">
      <div class="form-wrap">

        <div class="form-header">
          <h2 class="form-title">Create New Profile</h2>
          <p class="form-subtitle">Input your basic details to begin the journey.</p>
        </div>

        <div class="social-grid">
          <button class="social-button" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.25 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0 0 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.43.34-2.09V7.06H2.18A11 11 0 0 0 1 12c0 1.77.43 3.45 1.18 4.94l3.66-2.85z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 0 0-9.82 6.06l3.66 2.85C6.71 7.31 9.14 5.38 12 5.38z" fill="#EA4335"/>
            </svg>
            <span>Google</span>
          </button>
          <button class="social-button" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.53.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 0z"/>
            </svg>
            <span>Github</span>
          </button>
        </div>

        <div class="divider">
          <span>Or</span>
        </div>

        <form class="signup-form" id="signupForm">
          <div class="name-grid">
            <div class="input-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" placeholder="ex. Alex" autocomplete="given-name">
            </div>
            <div class="input-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" placeholder="ex. Sterling" autocomplete="family-name">
            </div>
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="ex. alex.s@aurora.io" autocomplete="email">
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" placeholder="Secure your account" autocomplete="new-password">
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <p class="helper-text">Requires at least 8 symbols.</p>
          </div>

          <button type="submit" class="submit-button">Create Account</button>
        </form>

        <p class="footer-link">Member of the team? <a href="#">Log in</a></p>

      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
