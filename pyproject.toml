[project]
name = "friday-voice-backend"
version = "0.1.0"
description = "Multilingual full-duplex agentic voice assistant backend for the Friday frontend"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "ddgs>=9.0.0",
  "livekit>=1.0.0",
  "livekit-api>=1.0.0",
  "livekit-agents>=1.2.0",
  "livekit-plugins-rime>=1.2.0",
  "livekit-plugins-openai>=1.2.0",
  "livekit-plugins-silero>=1.2.0",
  "python-jose[cryptography]>=3.3.0",
  "langdetect>=1.0.9",
  "edge-tts>=7.0.0",
  "aiofiles>=24.1.0",
  "livekit-plugins-google>=1.8.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "app*"]
